<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEG Virtual Twin Implementation</title>
<link rel="icon" type="image/png" href="assets/r_icon.png">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<canvas id="cvect-background"></canvas>

<header class="header">

    <div class="header-row">

        <img src="assets/logo.png" class="logo">

        <div class="title-block">

            <h1>TEG Virtual Twin Implementation</h1>

            <p>
            Digital Twin Platform for Thermoelectric Energy Harvesting
            under Snow and Extreme Climate Conditions
            </p>

        </div>

        <img src="assets/stebcsh.png" class="logo">

    </div>

</header>

<main>

	<section class="simulation-container">

		<div id="unity-container">

			<canvas id="unity-canvas"></canvas>

			<div id="unity-loading-bar">
				<div id="unity-progress-bar-empty">
					<div id="unity-progress-bar-full"></div>
				</div>
			</div>

			<div id="unity-warning"></div>

			<button id="unity-fullscreen-button">
				Fullscreen
			</button>

		</div>

	</section>

</main>

<script src="js/cvect-background.js"></script>



    <script>
const canvas = document.querySelector("#unity-canvas");

const config = {
    dataUrl: "Build/Build.data",
    frameworkUrl: "Build/Build.framework.js",
    codeUrl: "Build/Build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "TEG-VT",
    productVersion: "0.1"
};

const script = document.createElement("script");
script.src = "Build/Build.loader.js";

script.onload = () => {

    createUnityInstance(
        canvas,
        config,
        (progress) => {
            document.querySelector(
                "#unity-progress-bar-full"
            ).style.width = (progress * 100) + "%";
        }
    ).then((unityInstance) => {

        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button")
            .onclick = () => unityInstance.SetFullscreen(1);

    });

};

document.body.appendChild(script);
    </script>

</body>
</html>
