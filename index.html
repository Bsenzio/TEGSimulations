<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEG Virtual Twin Implementation</title>
<link rel="icon" type="image/png" href="assets/r_icon.png">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<canvas id="cvect-background"></canvas>

<header class="header">

    <div class="header-row">

        <img src="assets/logo.png" class="logo">

        <div class="title-block">

            <h1>TEG Virtual Twin Implementation</h1>

            <p>
            Digital Twin Platform for Thermoelectric Energy Harvesting
            under Snow and Extreme Climate Conditions
            </p>

        </div>

        <img src="assets/stebcsh.png" class="logo">

    </div>

</header>

<main>

    <section class="simulation-container">

        <div id="unity-container">

            <!-- Unity WebGL Canvas -->
            <canvas id="unity-canvas"></canvas>

        </div>

    </section>

</main>

<script src="js/cvect-background.js"></script>

<!-- Unity Loader -->
<script src="Build/WebGL.loader.js"></script>

<script>

    const canvas = document.querySelector("#unity-canvas");

    createUnityInstance(canvas, {
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm"
    });

</script>


</body>
</html>
